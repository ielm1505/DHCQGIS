        <script>
            fetch('verificar_sesion.php')
    .then(response => response.json())
    .then(data => {
       if (!data.activo) {
            window.location.href = '/dashboard/index.html'; // Redirige al login si no hay sesión activa
        } else {
            let usuarioElem = document.getElementById('usuario');
            if (usuarioElem) usuarioElem.textContent = data.usuario;
        }
    })
    .catch(error => console.error('Error:', error));
    
      //  Función para cerrar sesión
  function cerrarSesion() {
            window.location.href = "/dashboard/logout.php"; // Redirige al logout.php
        }
        let inactivityTime = 20 * 60 * 1000; // 20 minutos en milisegundos
let timeout;

function resetTimer() {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
        window.location.href = "/dashboard/logout.php"; // Redirige al cerrar sesión
    }, inactivityTime);
}

// Eventos que reinician el temporizador
document.addEventListener("mousemove", resetTimer);
document.addEventListener("keypress", resetTimer);
document.addEventListener("click", resetTimer);
document.addEventListener("scroll", resetTimer);
document.addEventListener("touchstart", resetTimer);

// Iniciar el temporizador por primera vez
resetTimer();
    


        </script>
