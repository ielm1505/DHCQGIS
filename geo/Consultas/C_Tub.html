<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta Tuberias</title>

    <!-- OpenLayers y Chart.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.0/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@7.5.0/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        #map {
            width: 100% ;
            height: 1000px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h2>Tubería</h2>

<div id="map"></div>

<!-- Filtros -->
<div style="padding: 10px; background: #f8f8f8; border: 1px solid #ccc;">
    <h3>Filtrar Conducciones</h3>

    <label for="Municipio">Municipio:</label>
    <select id="Municipio">
        <option value="">--Todos--</option>
    </select>

    <label for="Estatus">Estatus:</label>
    <select id="Estatus">
        <option value="">--Todos--</option>
    </select>

    <label for="Tipo_de_Re">Tipo:</label>
    <select id="Tipo_de_Re">
        <option value="">--Todos--</option>
    </select>

    <div id="filtroDiametro" style="display:none;">
        <label for="DIAMETRE">Diámetro:</label>
        <select id="DIAMETRE" multiple size="4">
            <option value="">--Todos--</option>
        </select>
    </div>
    <label>
        <input type="checkbox" id="toggleDiametro" onchange="toggleFiltroDiametro()"/>
        Diámetro
    </label>

    <div id="filtroMaterial" style="display:none;">
        <label for="MATERIAU">Material:</label>
        <select id="MATERIAU" multiple size="4">
            <option value="">--Todos--</option>
        </select>
    </div>
    <label>
        <input type="checkbox" id="toggleMaterial" onchange="toggleFiltroMaterial()"/>
        Material
    </label>

    <br><br>
    <button onclick="aplicarFiltros()">Aplicar Filtros</button>
    <button onclick="resetearFiltros()">Mostrar Todo</button>
    <button onclick="limpiarTodosLosFiltros()">Limpiar</button>
</div>

<!-- Estadísticas -->
<div id="estadisticas" style="padding: 10px; background: #e8f5e9; border: 1px solid #ccc; margin-top: 10px;">
    <h4>Estadísticas</h4>
    <div id="contenido_estadisticas">No hay datos cargados todavía.</div>
    <canvas id="graficaTipos" style="margin-top: 20px; max-width: 600px;"></canvas>
</div>

<script>
// Fuente y capa vectorial
var jsonSource_Conduccion_BJ_copy_1 = new ol.source.Vector();
var lyr_Conduccion_BJ_copy_1 = new ol.layer.Vector({
    source: jsonSource_Conduccion_BJ_copy_1,
    style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: 'blue', width: 2 })
    })
});

// Mapa
var map = new ol.Map({
    target: 'map',
    layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() }),
        lyr_Conduccion_BJ_copy_1
    ],
    view: new ol.View({
        center: ol.proj.fromLonLat([-86.8475, 20.885]),
        zoom: 10.7
    })
});

// Mostrar/ocultar filtros
function toggleFiltroDiametro() {
    const div = document.getElementById("filtroDiametro");
    const select = document.getElementById("DIAMETRE");
    const checked = document.getElementById("toggleDiametro").checked;

    if (!checked) {
        for (let i = 0; i < select.options.length; i++) {
            select.options[i].selected = false;
        }
    }
    div.style.display = checked ? "block" : "none";
}

function toggleFiltroMaterial() {
    const div = document.getElementById("filtroMaterial");
    const select = document.getElementById("MATERIAU");
    const checked = document.getElementById("toggleMaterial").checked;

    if (!checked) {
        for (let i = 0; i < select.options.length; i++) {
            select.options[i].selected = false;
        }
    }
    div.style.display = checked ? "block" : "none";
}

// Cargar datos iniciales
function cargarDatosIniciales() {
    var url = "https://dhcqgis.aguakan.com/geoserver/wfs?" +
              "service=WFS&version=1.0.0&request=GetFeature&typeName=DHC_AGUAKAN:AEP_CANA_AP" +
              "&outputFormat=application/json&srsname=EPSG:3857";

    fetch(url)
        .then(r => r.json())
        .then(data => {
            var format = new ol.format.GeoJSON();
            var features = format.readFeatures(data, { featureProjection: 'EPSG:3857' });
            jsonSource_Conduccion_BJ_copy_1.clear();
            jsonSource_Conduccion_BJ_copy_1.addFeatures(features);
            llenarSelects(features);
            calcularEstadisticas(features);
        });
}

// Llenar selects
function limpiarSelect(select) {
    while (select.options.length > 1) {
        select.remove(1);
    }
}

function llenarSelects(features) {
    let estatusSet = new Set();
    let tipoSet = new Set();
    let diametroSet = new Set();
    let materialSet = new Set();
    let municipioSet = new Set();

    features.forEach(f => {
        estatusSet.add(f.get('Estatus'));
        tipoSet.add(f.get('Tipo_de_Re'));
        diametroSet.add(f.get('DIAMETRE'));
        materialSet.add(f.get('MATERIAU'));
        municipioSet.add(f.get('Municipio'));

    });

    let estatusSelect = document.getElementById('Estatus');
    let tipoSelect = document.getElementById('Tipo_de_Re');
    let diametroSelect = document.getElementById('DIAMETRE');
    let materialSelect = document.getElementById('MATERIAU');
    let municipioSelect = document.getElementById('Municipio');

    limpiarSelect(estatusSelect);
    limpiarSelect(tipoSelect);
    limpiarSelect(diametroSelect);
    limpiarSelect(materialSelect);
    limpiarSelect(municipioSelect);

    municipioSet.forEach(val => {
        if (val) municipioSelect.append(new Option(val, val));
    });

    estatusSet.forEach(val => {
        if (val) estatusSelect.append(new Option(val, val));
    });

    tipoSet.forEach(val => {
        if (val) tipoSelect.append(new Option(val, val));
    });

    diametroSet.forEach(val => {
        if (val) diametroSelect.append(new Option(val, val));
    });

    materialSet.forEach(val => {
        if (val) materialSelect.append(new Option(val, val));
    });

    

   
}

// Aplicar filtros
function aplicarFiltros() {
    var estatus = document.getElementById('Estatus').value;
    var tipo = document.getElementById('Tipo_de_Re').value;
    var municipio = document.getElementById('Municipio').value;



    var diametros = Array.from(document.getElementById('DIAMETRE').selectedOptions)
                          .map(o => o.value).filter(v => v !== '');
    var materiales = Array.from(document.getElementById('MATERIAU').selectedOptions)
                          .map(o => o.value).filter(v => v !== '');

    var filtros = [];

    if (estatus) filtros.push(`Estatus='${estatus}'`);
    if (tipo) filtros.push(`Tipo_de_Re='${tipo}'`);
    if (diametros.length > 0) filtros.push('(' + diametros.map(d => `DIAMETRE='${d}'`).join(' OR ') + ')');
    if (materiales.length > 0) filtros.push('(' + materiales.map(m => `MATERIAU='${m}'`).join(' OR ') + ')');
    if (municipio) filtros.push(`Municipio='${municipio}'`);
    var cql = filtros.join(' AND ');
    consultarWFSporAtributo(cql);
}

// Consultar con CQL
function consultarWFSporAtributo(cql) {
    var url = "https://dhcqgis.aguakan.com/geoserver/wfs?" +
              "service=WFS&version=1.0.0&request=GetFeature&typeName= DHC_AGUAKAN:AEP_CANA_AP" +
              "&outputFormat=application/json&srsname=EPSG:3857";

    if (cql) url += "&CQL_FILTER=" + encodeURIComponent(cql);

    fetch(url)
        .then(r => r.json())
        .then(data => {
            var format = new ol.format.GeoJSON();
            var features = format.readFeatures(data, { featureProjection: 'EPSG:3857' });
            jsonSource_Conduccion_BJ_copy_1.clear();
            jsonSource_Conduccion_BJ_copy_1.addFeatures(features);
            calcularEstadisticas(features);
        });
}

// Limpiar y resetear filtros
function resetearFiltros() {
    document.getElementById('Estatus').value = '';
    document.getElementById('Tipo_de_Re').value = '';
    document.getElementById('DIAMETRE').value = '';
    document.getElementById('MATERIAU').value = '';
    cargarDatosIniciales();
}

function limpiarTodosLosFiltros() {
    document.getElementById('Estatus').value = '';
    document.getElementById('Tipo_de_Re').value = '';

    ['DIAMETRE', 'MATERIAU'].forEach(id => {
        let sel = document.getElementById(id);
        for (let i = 0; i < sel.options.length; i++) {
            sel.options[i].selected = false;
        }
    });

    aplicarFiltros();
}

// Estadísticas
function calcularEstadisticas(features) {
    let total = features.length;
    let existente = 0, Q2023_2027 = 0, conduccion = 0, distribucion = 0;
    let longitudConduccion = 0, longitudDistribucion = 0;
    let sumaLongitud = 0;
    let matriz = {}; // diametro -> material -> longitud
    let diametrosSet = new Set();
    let materialesSet = new Set();

    features.forEach(f => {
        let estatus = f.get('Estatus');
        let tipo = f.get('Tipo_de_Re');
        let longitud = parseFloat(f.get('Longitud')) || 0;
        let diametro = f.get('DIAMETRE') || 'N/D';
        let material = f.get('MATERIAU') || 'N/D';

        if (estatus === 'Existente') existente++;
        else if (estatus === 'Q2023_2027') Q2023_2027++;

        if (tipo === 'Conduccion') {
            conduccion++;
            longitudConduccion += longitud;
        } else if (tipo === 'Distribucion') {
            distribucion++;
            longitudDistribucion += longitud;
        }

        sumaLongitud += longitud;

        // Construir matriz: fila = diametro, columna = material
        if (!matriz[diametro]) matriz[diametro] = {};
        if (!matriz[diametro][material]) matriz[diametro][material] = 0;
        matriz[diametro][material] += longitud;

        diametrosSet.add(diametro);
        materialesSet.add(material);
    });

    let html = `
        <table border="1">
            <tr><th>Descripción</th><th>Valor</th></tr>
            <tr><td>Total de registros:</td><td>${total}</td></tr>
            <tr><td>Estatus - Existente:</td><td>${existente}</td></tr>
            <tr><td>Estatus - Q2023_2027:</td><td>${Q2023_2027}</td></tr>
            <tr><td>Tipo - Conducción:</td><td>${conduccion}</td></tr>
            <tr><td>Tipo - Distribución:</td><td>${distribucion}</td></tr>
            <tr><td>Longitud total Conducción:</td><td>${longitudConduccion.toLocaleString()}</td></tr>
            <tr><td>Longitud total Distribución:</td><td>${longitudDistribucion.toLocaleString()}</td></tr>
            <tr><td>Longitud total Tubería:</td><td>${sumaLongitud.toLocaleString()}</td></tr>
        </table>
        <h4>Matriz de Longitud Total (Diámetro × Material)</h4>
        <table border="1">
            <thead>
                <tr>
                    <th>Diámetro \\ Material</th>
                    ${[...materialesSet].sort().map(m => `<th>${m}</th>`).join('')}
                </tr>
            </thead>
          <tbody>
    ${[...diametrosSet].sort().map(d => `
        <tr>
            <td>${d}</td>
            ${[...materialesSet].sort().map(m => `<td>${(matriz[d][m] || 0).toLocaleString()}</td>`).join('')}
        </tr>
    `).join('')}

    <!-- Fila de totales por material -->
    <tr>
        <td><strong>Totales</strong></td>
        ${[...materialesSet].sort().map(m => {
            let totalMaterial = [...diametrosSet].reduce((sum, d) => {
                return sum + (matriz[d][m] || 0);
            }, 0);
            return `<td><strong>${totalMaterial.toLocaleString()}</strong></td>`;
        }).join('')}
    </tr>
</tbody>

        </table>
    `;

    document.getElementById('contenido_estadisticas').innerHTML = html;

    // Gráfico (igual que antes)
    const canvas = document.getElementById('graficaTipos');
    if (canvas && typeof Chart !== "undefined") {
        const ctx = canvas.getContext('2d');
        if (window.chartTipos) window.chartTipos.destroy();
        window.chartTipos = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Conducción', 'Distribución'],
                datasets: [{
                    label: 'Longitud total (m)',
                    data: [longitudConduccion, longitudDistribucion],
                    backgroundColor: ['#42a5f5', '#66bb6a']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: 'Longitud total por tipo' }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: val => val.toLocaleString('es-MX')
                        }
                    }
                }
            }
        });
    }
}


// Cargar al iniciar
cargarDatosIniciales();
</script>

</body>
</html>
