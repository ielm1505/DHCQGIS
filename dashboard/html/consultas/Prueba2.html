<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Capas agrupadas (AP / DS)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol/ol.js"></script>

<style>
  body { margin:0; font-family: Arial; }
  #map { width: calc(100% - 220px); height: 100vh; float:right; }
  #layerControl {
    width: 220px;
    height: 100vh;
    background: #f7f7f7;
    padding: 10px;
    border-right: 1px solid #ccc;
    overflow-y: auto;
  }
  h3 { 
    margin-top: 10px; 
    border-bottom: 1px solid #aaa; 
    padding-bottom: 4px; 
    display:flex;
    justify-content: space-between;
    align-items: center;
  }
  label { display: block; margin: 5px 0; cursor: pointer; }
</style>
</head>
<body>

<div id="layerControl">
  <h2>Capas</h2>

  <h3>
    <span>AP</span>
    <input type="checkbox" class="groupToggle" data-group="AP" checked>
  </h3>
  <label><input type="checkbox" class="layerToggle" data-group="AP" data-layer="Tanques_BJ" checked> Tanques BJ</label>
  <label><input type="checkbox" class="layerToggle" data-group="AP" data-layer="Tanques_SOL" checked> Tanques SOL</label>

  <h3>
    <span>DS</span>
    <input type="checkbox" class="groupToggle" data-group="DS">
  </h3>
  <label><input type="checkbox" class="layerToggle" data-group="DS" data-layer="Tanques_PM"> Tanques PM</label>
  <label><input type="checkbox" class="layerToggle" data-group="DS" data-layer="Tanques_IM"> Tanques IM</label>
</div>

<div id="map"></div>

<script>
// ---- FUNCIÓN PARA CREAR CAPAS ----
function crearCapa(nombre, color, typeName, visible = true) {
  return new ol.layer.Vector({
    source: new ol.source.Vector({
      url: `https://dhcqgis.aguakan.com/geoserver/wfs?service=WFS&version=1.0.0&request=GetFeature&typeName=${typeName}&outputFormat=application/json&srsname=EPSG:3857&CQL_FILTER=Estatus='Existente'`,
      format: new ol.format.GeoJSON()
    }),
    style: new ol.style.Style({
      image: new ol.style.Circle({
        radius: 6,
        fill: new ol.style.Fill({ color }),
        stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
      })
    }),
    name: nombre,
    visible
  });
}

// ---- CREAR CAPAS ----
const capaTanquesBJ  = crearCapa('Tanques_BJ', 'blue',   'DHC_AGUAKAN:Tanques_BJ', true);
const capaTanquesSOL = crearCapa('Tanques_SOL', 'red',   'DHC_AGUAKAN:Tanques_SOL', true);
const capaTanquesPM  = crearCapa('Tanques_PM', 'orange', 'DHC_AGUAKAN:Tanques_PM', false);
const capaTanquesIM  = crearCapa('Tanques_IM', 'purple', 'DHC_AGUAKAN:Tanques_IM', false);

// ---- MAPA ----
const map = new ol.Map({
  target: 'map',
  layers: [
    new ol.layer.Tile({ source: new ol.source.OSM() }),
    capaTanquesBJ,
    capaTanquesSOL,
    capaTanquesPM,
    capaTanquesIM
  ],
  view: new ol.View({
    center: ol.proj.fromLonLat([-86.75, 20.9]),
    zoom: 10.5
  })
});

// ---- DICCIONARIO DE CAPAS ----
const capas = {
  'Tanques_BJ': capaTanquesBJ,
  'Tanques_SOL': capaTanquesSOL,
  'Tanques_PM': capaTanquesPM,
  'Tanques_IM': capaTanquesIM
};

// ---- EVENTO INDIVIDUAL ----
document.querySelectorAll('.layerToggle').forEach(chk => {
  chk.addEventListener('change', e => {
    const nombre = e.target.dataset.layer;
    capas[nombre].setVisible(e.target.checked);

    // Actualizar checkbox maestro del grupo
    const grupo = e.target.dataset.group;
    const groupChecks = document.querySelectorAll(`.layerToggle[data-group="${grupo}"]`);
    const allOn = Array.from(groupChecks).every(c => c.checked);
    document.querySelector(`.groupToggle[data-group="${grupo}"]`).checked = allOn;
  });
});

// ---- EVENTO GRUPO ----
document.querySelectorAll('.groupToggle').forEach(grp => {
  grp.addEventListener('change', e => {
    const grupo = e.target.dataset.group;
    const isChecked = e.target.checked;

    // Cambiar todos los hijos
    document.querySelectorAll(`.layerToggle[data-group="${grupo}"]`).forEach(chk => {
      chk.checked = isChecked;
      capas[chk.dataset.layer].setVisible(isChecked);
    });
  });
});
</script>

</body>
</html>
